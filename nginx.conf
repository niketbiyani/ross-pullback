# Ross Pullback Scanner — nginx server block
#
# OPTION A: Subdomain (e.g. scanner.yourdomain.com)
#   1. Copy to: /etc/nginx/sites-available/ross-scanner
#   2. Replace scanner.yourdomain.com with your actual subdomain
#   3. ln -s /etc/nginx/sites-available/ross-scanner /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. (Optional) run: certbot --nginx -d scanner.yourdomain.com
#
# OPTION B: Path on existing domain (e.g. yourdomain.com/scanner)
#   Add the location block below into your existing server block.

# ── OPTION A: Subdomain ───────────────────────────────────────────────────
server {
    listen 80;
    server_name scanner.yourdomain.com;

    location / {
        proxy_pass         http://127.0.0.1:5050;
        proxy_http_version 1.1;

        # Required for SSE (live alert stream)
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600;
    }
}


